<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inadimplência Produtos PJ</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1d2330;--mut:#667085;--bd:#e3e6ec;--ac:#1f4e9c;--ac2:#e8effa;--red:#c0392b;--grn:#1e8449;--amb:#b9770e}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12151c;--card:#1b202b;--tx:#e8ebf1;--mut:#9aa3b5;--bd:#2c3341;--ac:#6ea0f0;--ac2:#243247;--red:#ec7063;--grn:#58d68d;--amb:#f5b041}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,Segoe UI,Arial,sans-serif}
header{padding:16px 24px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
h1{margin:0;font-size:20px}h1 small{display:block;font-weight:400;color:var(--mut);font-size:12px;margin-top:2px}
button,select,input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:6px 10px}
button{cursor:pointer}button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
main{padding:0 24px 32px;max-width:1500px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:14px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.filters label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{padding:3px 10px;border-radius:999px;border:1px solid var(--bd);background:var(--card);font-size:12px;cursor:pointer;user-select:none}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px 14px}
.kpi span{font-size:12px;color:var(--mut)}.kpi b{display:block;font-size:22px;margin-top:2px}.kpi i{font-style:normal;font-size:12px;color:var(--mut)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:14px}
.chart{position:relative;height:300px}
.tabs{display:flex;gap:4px;margin-bottom:14px}.tabs button{border-radius:6px 6px 0 0}.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
th{color:var(--mut);font-weight:600;position:sticky;top:0;background:var(--card)}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.tot td{font-weight:700;border-top:2px solid var(--bd)}
.scroll{overflow:auto;max-height:560px}
th.s{cursor:pointer}th.s:hover{color:var(--ac)}
.ins{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ins li{padding:8px 12px;border-left:4px solid var(--ac);background:var(--ac2);border-radius:4px}
.ins li.r{border-color:var(--red)}.ins li.a{border-color:var(--amb)}.ins li.g{border-color:var(--grn)}
.pg{display:flex;gap:8px;align-items:center;margin-top:10px;color:var(--mut)}
.hide{display:none}
@media (max-width:600px){header,main{padding-left:12px;padding-right:12px}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>Inadimplência — Produtos PJ Condor<small id="sub"></small></h1>
  <div><button id="bx" class="pri">Exportar Excel</button> <button id="bp" class="pri">Exportar PDF</button></div>
</header>
<main>
  <div class="card">
    <div class="filters">
      <label>Situação<select id="fSt"><option value="">Todas</option><option value="V">Vencido</option><option value="A">A vencer</option></select></label>
      <label>Ano de vencimento<select id="fAno"><option value="">Todos</option></select></label>
      <label>Mês de vencimento<select id="fMes"><option value="">Todos</option></select></label>
      <label>Loja / filial<select id="fLoja"><option value="">Todas</option></select></label>
      <label>Buscar (devedor, CNPJ/CPF, NF)<input id="fQ" placeholder="texto…" style="width:220px"></label>
      <button id="fClr">Limpar</button>
    </div>
    <div class="chips" id="chProd"></div>
    <div class="chips" id="chFx"></div>
  </div>
  <div class="tabs"><button data-t="res" class="on">Resumo</button><button data-t="ana">Analítico</button></div>

  <section id="t-res">
    <div class="kpis" id="kpis"></div>
    <div class="card"><h2>Insights</h2><ul class="ins" id="ins"></ul></div>
    <div class="grid2">
      <div class="card"><h2>Vencido por faixa de atraso (por produto)</h2><div class="chart"><canvas id="c1"></canvas></div></div>
      <div class="card"><h2>Vencido × a vencer por produto</h2><div class="chart"><canvas id="c2"></canvas></div></div>
    </div>
    <div class="card"><h2>A vencer por mês de vencimento</h2><div class="chart" style="height:240px"><canvas id="c3"></canvas></div></div>
    <div class="card"><h2>Produto × faixa de atraso</h2><div class="scroll"><table id="mx"></table></div></div>
    <div class="grid2">
      <div class="card" id="cTop"><h2>Maiores devedores (vencido)</h2><div class="scroll"><table id="top"></table></div></div>
      <div class="card"><h2>Lojas / filiais com maior vencido</h2><div class="scroll"><table id="lj"></table></div></div>
    </div>
  </section>

  <section id="t-ana" class="hide">
    <div class="card"><h2 id="anaH">Analítico</h2><div class="scroll"><table id="an"></table></div>
      <div class="pg"><button id="pv">‹</button><span id="pi"></span><button id="pn">›</button></div></div>
  </section>
</main>
<script>
const DATA=/*DATA*/null;
const FX=[["1–30",1,30],["31–60",31,60],["61–90",61,90],["91–180",91,180],["181–360",181,360],["361–720",361,720],[">720",721,1e9]];
const MESES=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
const PUB=!!DATA.pub;
const $=id=>document.getElementById(id);
const brl=v=>v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const mi=v=>Math.abs(v)>=1e6?"R$ "+(v/1e6).toFixed(2).replace(".",",")+" mi":Math.abs(v)>=1e3?"R$ "+(v/1e3).toFixed(0)+" mil":brl(v);
const pct=v=>(v*100).toFixed(1).replace(".",",")+"%";
const dmy=s=>s?s.split("-").reverse().join("/"):"";
const fxOf=a=>a<=0?-1:FX.findIndex(f=>a>=f[1]&&a<=f[2]);
const PN=Object.fromEntries(DATA.prods.map(p=>[p[0],p[1]]));
const COLORS=["#1f4e9c","#e67e22","#27ae60","#8e44ad","#c0392b","#16a085","#f1c40f","#7f8c8d","#d35400","#2c3e50"];
const R=DATA.rows.map(r=>({p:r[0],s:r[1],a:r[2],v:r[3],val:r[4],dev:DATA.devs[r[5]],doc:r[6],loja:DATA.lojas[r[7]]||"(sem loja)",nf:r[8],par:r[9],em:r[10],port:r[11],
  f:fxOf(r[2]),ano:+r[3].slice(0,4),mes:+r[3].slice(5,7)}));
const F={prods:new Set(),fx:new Set(),st:"",ano:"",mes:"",loja:"",q:""};
let cur=[],charts=[],sortK="val",sortD=-1,page=0;const PS=100;
const sum=(a,k="val")=>a.reduce((s,r)=>s+r[k],0);
const group=(a,fn)=>{const m=new Map();a.forEach(r=>{const k=fn(r);(m.get(k)||m.set(k,[]).get(k)).push(r)});return m};

function init(){
  $("sub").textContent=`Posição de ${dmy(DATA.ref)} (extração ${DATA.pasta}) · ${R.length.toLocaleString("pt-BR")} títulos/cheques`;
  const anos=[...new Set(R.map(r=>r.ano))].sort((a,b)=>b-a);
  $("fAno").innerHTML+=anos.map(a=>`<option>${a}</option>`).join("");
  $("fMes").innerHTML+=MESES.map((m,i)=>`<option value="${i+1}">${m}</option>`).join("");
  $("fLoja").innerHTML+=[...new Set(R.map(r=>r.loja))].sort().map(l=>`<option>${l}</option>`).join("");
  $("chProd").innerHTML="<b style='font-size:12px;color:var(--mut)'>Produto:</b>"+DATA.prods.map(p=>`<span class="chip" data-p="${p[0]}">${p[1]} (${p[0]})</span>`).join("");
  $("chFx").innerHTML="<b style='font-size:12px;color:var(--mut)'>Faixa de atraso (dias):</b>"+FX.map((f,i)=>`<span class="chip" data-f="${i}">${f[0]}</span>`).join("");
  $("chProd").onclick=e=>{const p=e.target.dataset.p;if(!p)return;F.prods.has(p)?F.prods.delete(p):F.prods.add(p);e.target.classList.toggle("on");upd()};
  $("chFx").onclick=e=>{if(e.target.dataset.f==null)return;const f=+e.target.dataset.f;F.fx.has(f)?F.fx.delete(f):F.fx.add(f);e.target.classList.toggle("on");upd()};
  for(const [id,k] of [["fSt","st"],["fAno","ano"],["fMes","mes"],["fLoja","loja"]])$(id).onchange=e=>{F[k]=e.target.value;upd()};
  let t;$("fQ").oninput=e=>{clearTimeout(t);t=setTimeout(()=>{F.q=e.target.value.trim().toLowerCase();upd()},250)};
  $("fClr").onclick=()=>{F.prods.clear();F.fx.clear();Object.assign(F,{st:"",ano:"",mes:"",loja:"",q:""});
    document.querySelectorAll(".filters select").forEach(s=>s.value="");$("fQ").value="";document.querySelectorAll(".chip.on").forEach(c=>c.classList.remove("on"));upd()};
  document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));
    $("t-res").classList.toggle("hide",b.dataset.t!="res");$("t-ana").classList.toggle("hide",b.dataset.t!="ana")});
  $("pv").onclick=()=>{page=Math.max(0,page-1);anal()};$("pn").onclick=()=>{page++;anal()};
  $("bx").onclick=xlsx;$("bp").onclick=pdf;
  if(PUB){$("cTop").classList.add("hide");$("fQ").parentNode.firstChild.textContent="Buscar (NF / cheque)";$("sub").textContent+=" · versão pública (sem identificação de devedores)"}
  upd();
}

function filtra(){
  return R.filter(r=>(!F.prods.size||F.prods.has(r.p))&&(!F.st||r.s==F.st)&&(!F.ano||r.ano==F.ano)&&(!F.mes||r.mes==F.mes)&&(!F.loja||r.loja==F.loja)
    &&(!F.fx.size||F.fx.has(r.f))&&(!F.q||(r.dev+" "+r.doc+" "+r.nf).toLowerCase().includes(F.q)));
}
function upd(){page=0;cur=filtra();kpis();insights();graficos();tabelas();anal()}

function kpis(){
  const V=cur.filter(r=>r.s=="V"),A=cur.filter(r=>r.s=="A"),vv=sum(V),va=sum(A);
  const atr=vv?V.reduce((s,r)=>s+r.a*r.val,0)/vv:0;
  const k=[["Carteira total",mi(vv+va),`${cur.length.toLocaleString("pt-BR")} títulos`],["Vencido",mi(vv),`${V.length.toLocaleString("pt-BR")} títulos`],
    ["A vencer",mi(va),`${A.length.toLocaleString("pt-BR")} títulos`],["% vencido",vv+va?pct(vv/(vv+va)):"–","do total filtrado"],
    ["Atraso médio (pond. por valor)",Math.round(atr).toLocaleString("pt-BR")+" dias",`${(atr/365).toFixed(1).replace(".",",")} anos`]]
    .concat(PUB?[]:[["Devedores distintos",new Set(V.map(r=>r.dev)).size.toLocaleString("pt-BR"),"com vencido"]]);
  $("kpis").innerHTML=k.map(x=>`<div class="kpi"><span>${x[0]}</span><b>${x[1]}</b><i>${x[2]}</i></div>`).join("");
}

function insights(){
  const V=cur.filter(r=>r.s=="V"),vv=sum(V),out=[];
  if(!V.length){$("ins").innerHTML="<li>Sem vencido no filtro atual.</li>";return}
  const byFx=FX.map((_,i)=>sum(V.filter(r=>r.f==i)));
  const old=byFx[5]+byFx[6],rec=byFx[0]+byFx[1];
  out.push(["r",`<b>${pct(old/vv)}</b> do vencido (${mi(old)}) tem mais de 360 dias de atraso — dificilmente recuperável pela cobrança comum; candidato a revisão de provisão/baixa ou cobrança jurídica.`]);
  out.push(["g",`<b>${mi(rec)}</b> (${pct(rec/vv)}) está em até 60 dias — janela de maior recuperação; priorizar régua de cobrança aqui.`]);
  if(!PUB){const dv=[...group(V,r=>r.dev)].map(([k,a])=>[k,sum(a)]).sort((a,b)=>b[1]-a[1]);
  const t10=dv.slice(0,10).reduce((s,x)=>s+x[1],0);
  out.push(["a",`Os 10 maiores devedores concentram <b>${pct(t10/vv)}</b> do vencido; o maior é <b>${dv[0][0]}</b> (${mi(dv[0][1])}).`])}
  const pr=[...group(cur.filter(r=>r.p!="CHQ"),r=>r.p)].map(([k,a])=>{const v=sum(a.filter(r=>r.s=="V")),t=sum(a);return[k,v,t,t?v/t:0]}).filter(x=>x[2]>0).sort((a,b)=>b[3]-a[3]);
  if(pr.length>1)out.push(["r",`Maior taxa de inadimplência (vencido ÷ carteira): <b>${PN[pr[0][0]]}</b> com ${pct(pr[0][3])}; menor: ${PN[pr.at(-1)[0]]} (${pct(pr.at(-1)[3])}).`]);
  const pv=[...group(V,r=>r.p)].map(([k,a])=>[k,sum(a)]).sort((a,b)=>b[1]-a[1]);
  out.push(["a",`<b>${PN[pv[0][0]]}</b> responde por ${pct(pv[0][1]/vv)} do vencido (${mi(pv[0][1])}).`]);
  const lj=[...group(V,r=>r.loja)].map(([k,a])=>[k,sum(a)]).sort((a,b)=>b[1]-a[1])[0];
  out.push(["",`Loja/filial com mais vencido: <b>${lj[0]}</b> (${mi(lj[1])}, ${pct(lj[1]/vv)}).`]);
  const A=cur.filter(r=>r.s=="A"),ref=new Date(DATA.ref+"T00:00"),lim=new Date(+ref+30*864e5).toISOString().slice(0,10);
  const p30=sum(A.filter(r=>r.v<=lim));
  if(A.length)out.push(["a",`<b>${mi(p30)}</b> vence nos próximos 30 dias — acompanhar de perto: é o que vira atraso 1–30 se não for pago.`]);
  const peq=V.filter(r=>r.val<500);
  if(peq.length>50)out.push(["",`${peq.length.toLocaleString("pt-BR")} títulos vencidos têm valor abaixo de R$ 500 (somam ${mi(sum(peq))}) — custo de cobrança individual pode superar o valor; avaliar tratamento em lote.`]);
  $("ins").innerHTML=out.map(x=>`<li class="${x[0]}">${x[1]}</li>`).join("");
}

function graficos(){
  charts.forEach(c=>c.destroy());charts=[];
  const dark=matchMedia("(prefers-color-scheme:dark)").matches,tc=dark?"#9aa3b5":"#667085";
  Chart.defaults.color=tc;Chart.defaults.borderColor=dark?"#2c3341":"#e3e6ec";
  const V=cur.filter(r=>r.s=="V"),ps=DATA.prods.filter(p=>cur.some(r=>r.p==p[0]));
  const tip={callbacks:{label:c=>`${c.dataset.label}: ${brl(c.parsed.y??c.parsed.x)}`}};
  const ax=v=>mi(v);
  charts.push(new Chart($("c1"),{type:"bar",data:{labels:FX.map(f=>f[0]+" d"),datasets:ps.map((p,i)=>({label:p[1],backgroundColor:COLORS[DATA.prods.indexOf(p)],
    data:FX.map((_,j)=>sum(V.filter(r=>r.p==p[0]&&r.f==j)))}))},options:{maintainAspectRatio:false,scales:{x:{stacked:true},y:{stacked:true,ticks:{callback:ax}}},plugins:{tooltip:tip,legend:{labels:{boxWidth:10,font:{size:10}}}}}}));
  charts.push(new Chart($("c2"),{type:"bar",data:{labels:ps.map(p=>p[1]),datasets:[
    {label:"Vencido",backgroundColor:"#c0392b",data:ps.map(p=>sum(cur.filter(r=>r.p==p[0]&&r.s=="V")))},
    {label:"A vencer",backgroundColor:"#27ae60",data:ps.map(p=>sum(cur.filter(r=>r.p==p[0]&&r.s=="A")))}]},
    options:{indexAxis:"y",maintainAspectRatio:false,scales:{x:{stacked:true,ticks:{callback:ax}},y:{stacked:true}},plugins:{tooltip:tip}}}));
  const A=cur.filter(r=>r.s=="A"),lim=DATA.ref.slice(0,4)*12+ +DATA.ref.slice(5,7)+17,m=new Map();
  A.forEach(r=>{const k=(+r.v.slice(0,4))*12+ +r.v.slice(5,7);const b=Math.min(k,lim+1);m.set(b,(m.get(b)||0)+r.val)});
  const ks=[...m.keys()].sort((a,b)=>a-b),lab=k=>k>lim?"Depois":MESES[(k-1)%12]+"/"+String(Math.floor((k-1)/12)).slice(2);
  charts.push(new Chart($("c3"),{type:"bar",data:{labels:ks.map(lab),datasets:[{label:"A vencer",backgroundColor:"#27ae60",data:ks.map(k=>m.get(k))}]},
    options:{maintainAspectRatio:false,scales:{y:{ticks:{callback:ax}}},plugins:{tooltip:tip,legend:{display:false}}}}));
}

function matriz(a=cur){
  const rows=DATA.prods.filter(p=>a.some(r=>r.p==p[0])).map(p=>{const x=a.filter(r=>r.p==p[0]),V=x.filter(r=>r.s=="V"),vv=sum(V),va=sum(x.filter(r=>r.s=="A"));
    return[p[1],...FX.map((_,j)=>sum(V.filter(r=>r.f==j))),vv,va,vv+va,vv+va?vv/(vv+va):0]});
  const tot=["Total",...Array(FX.length+3).fill(0).map((_,i)=>rows.reduce((s,r)=>s+r[i+1],0))];tot.push(tot[FX.length+3]?tot[FX.length+1]/tot[FX.length+3]:0);
  return{head:["Produto",...FX.map(f=>f[0]),"Vencido","A vencer","Total","% venc."],rows:[...rows,tot]};
}
function tabelas(){
  const m=matriz(),fm=(r,i)=>i==r.length-1?pct(r[i]):brl(r[i]);
  $("mx").innerHTML="<tr>"+m.head.map((h,i)=>`<th class="${i?"n":""}">${h}</th>`).join("")+"</tr>"+
    m.rows.map((r,k)=>`<tr class="${k==m.rows.length-1?"tot":""}">`+r.map((c,i)=>i?`<td class="n">${fm(r,i)}</td>`:`<td>${c}</td>`).join("")+"</tr>").join("");
  const V=cur.filter(r=>r.s=="V"),vv=sum(V);
  const tab=(id,key,hd)=>{const g=[...group(V,key)].map(([k,a])=>[k,a.length,sum(a)]).sort((a,b)=>b[2]-a[2]).slice(0,15);
    $(id).innerHTML=`<tr><th>${hd}</th><th class="n">Títulos</th><th class="n">Vencido</th><th class="n">% do vencido</th></tr>`+g.map(x=>`<tr><td>${x[0]}</td><td class="n">${x[1]}</td><td class="n">${brl(x[2])}</td><td class="n">${pct(x[2]/vv)}</td></tr>`).join("")};
  if(!PUB)tab("top",r=>r.dev+" · "+r.doc,"Devedor");tab("lj",r=>r.loja,"Loja");
}

const COLS0=[["p","Produto",r=>PN[r.p]],["s","Situação",r=>r.s=="V"?"Vencido":"A vencer"],["f","Faixa",r=>r.f<0?"A vencer":FX[r.f][0]],["a","Atraso (d)",r=>r.a],["v","Vencimento",r=>dmy(r.v)],
  ["val","Valor",r=>r.val],["dev","Devedor",r=>r.dev],["doc","CNPJ/CPF ou código",r=>r.doc],["loja","Loja",r=>r.loja],["nf","NF / Cheque",r=>r.nf],["par","Parcela",r=>r.par||""],["em","Emissão",r=>dmy(r.em)],["port","Agenda / Portador",r=>r.port]];
const NOM=["dev","doc"];
const COLS=COLS0.filter(c=>!(PUB&&NOM.includes(c[0])));
function anal(){
  const a=[...cur].sort((x,y)=>(x[sortK]>y[sortK]?1:x[sortK]<y[sortK]?-1:0)*sortD),np=Math.max(1,Math.ceil(a.length/PS));page=Math.min(page,np-1);
  $("anaH").textContent=`Analítico — ${a.length.toLocaleString("pt-BR")} registros · ${brl(sum(a))}`;
  $("an").innerHTML="<tr>"+COLS.map(c=>`<th class="s ${c[0]=="val"||c[0]=="a"?"n":""}" data-k="${c[0]}">${c[1]}${sortK==c[0]?(sortD>0?" ▲":" ▼"):""}</th>`).join("")+"</tr>"+
    a.slice(page*PS,page*PS+PS).map(r=>"<tr>"+COLS.map(c=>c[0]=="val"?`<td class="n">${brl(r.val)}</td>`:c[0]=="a"?`<td class="n">${r.a>0?r.a:0}</td>`:`<td>${c[2](r)}</td>`).join("")+"</tr>").join("");
  document.querySelectorAll("#an th").forEach(th=>th.onclick=()=>{const k=th.dataset.k;sortD=sortK==k?-sortD:-1;sortK=k;anal()});
  $("pi").textContent=`Página ${page+1} de ${np}`;
}

function filtroTxt(){
  const p=[F.st&&(F.st=="V"?"Vencido":"A vencer"),F.prods.size&&[...F.prods].map(c=>PN[c]).join(", "),F.fx.size&&"Faixas: "+[...F.fx].sort().map(i=>FX[i][0]).join(", "),
    F.ano&&"Ano "+F.ano,F.mes&&"Mês "+MESES[F.mes-1],F.loja&&F.loja,F.q&&`Busca "${F.q}"`].filter(Boolean);
  return p.length?p.join(" · "):"Sem filtros (carteira completa)";
}
const stamp=()=>new Date().toISOString().slice(0,10);
function xlsx(){
  const m=matriz(),wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([["Inadimplência Produtos PJ Condor"],["Posição",dmy(DATA.ref)],["Filtros",filtroTxt()],[],m.head,...m.rows]),"Resumo");
  const a=[...cur].sort((x,y)=>y.val-x.val).map(r=>({Produto:PN[r.p],"Situação":r.s=="V"?"Vencido":"A vencer",Faixa:r.f<0?"A vencer":FX[r.f][0]+" d","Atraso (dias)":Math.max(0,r.a),
    Vencimento:dmy(r.v),Valor:r.val,Loja:r.loja,Parcela:r.par||"","Agenda / Portador":r.port,"NF/Cheque":r.nf,"Emissão":dmy(r.em),...(PUB?{}:{Devedor:r.dev,"CNPJ/CPF ou código":r.doc})}));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(a),"Analítico");

}
function pdf(){

  const V=cur.filter(r=>r.s=="V"),A=cur.filter(r=>r.s=="A"),vv=sum(V),va=sum(A);
  d.setFontSize(16);d.text("Inadimplência — Produtos PJ Condor",40,40);
  d.setFontSize(9);d.setTextColor(100);d.text(`Posição ${dmy(DATA.ref)} · gerado em ${dmy(stamp())}`,40,55);d.text("Filtros: "+filtroTxt(),40,67,{maxWidth:W-80});
  d.setTextColor(0);d.setFontSize(10);
  d.text(`Carteira ${brl(vv+va)}   |   Vencido ${brl(vv)} (${vv+va?pct(vv/(vv+va)):"–"})   |   A vencer ${brl(va)}   |   Devedores com vencido: ${new Set(V.map(r=>r.dev)).size}`,40,88);
  let y=100;

  [...$("ins").children].forEach(li=>{const t="• "+li.textContent,l=d.splitTextToSize(t,W-80);d.text(l,40,y);y+=l.length*11+3});
  const m=matriz(),cm=(r,i)=>i==r.length-1?pct(r[i]):brl(r[i]);
  d.autoTable({startY:y+6,head:[m.head],body:m.rows.map(r=>r.map((c,i)=>i?cm(r,i):c)),styles:{fontSize:7},headStyles:{fillColor:[31,78,156]},
    columnStyles:Object.fromEntries(m.head.map((_,i)=>[i,i?{halign:"right"}:{}])),didParseCell:h=>{if(h.row.index==m.rows.length-1)h.cell.styles.fontStyle="bold"}});
  if(!PUB){const top=[...group(V,r=>r.dev+" ("+r.doc+")")].map(([k,a])=>[k,a.length,sum(a)]).sort((a,b)=>b[2]-a[2]).slice(0,15);
  d.autoTable({head:[["Top 15 devedores (vencido)","Títulos","Vencido","% do vencido"]],body:top.map(x=>[x[0],x[1],brl(x[2]),pct(x[2]/vv)]),styles:{fontSize:7},headStyles:{fillColor:[31,78,156]},
    columnStyles:{1:{halign:"right"},2:{halign:"right"},3:{halign:"right"}}})}
  const CAP=3000,a=[...cur].sort((x,y)=>y.val-x.val).slice(0,CAP);
  d.addPage();d.setFontSize(11);d.text(`Analítico — ${a.length.toLocaleString("pt-BR")} maiores valores${cur.length>CAP?` de ${cur.length.toLocaleString("pt-BR")} (use o Excel para a lista completa)`:""}`,40,40);
  d.autoTable({startY:50,head:[["Produto","Sit.","Atraso","Venc.","Valor","Loja","NF/Chq"].concat(PUB?[]:["Devedor","CNPJ/CPF"])],
    body:a.map(r=>[PN[r.p],r.s=="V"?"Venc.":"A venc.",Math.max(0,r.a),dmy(r.v),brl(r.val),r.loja,r.nf].concat(PUB?[]:[r.dev,r.doc])),styles:{fontSize:6.5,cellPadding:2},headStyles:{fillColor:[31,78,156]},
    columnStyles:{2:{halign:"right"},4:{halign:"right"}}});
  const n=d.internal.getNumberOfPages();for(let i=1;i<=n;i++){d.setPage(i);d.setFontSize(8);d.setTextColor(120);d.text(`Página ${i}/${n}`,W-80,d.internal.pageSize.getHeight()-20)}
  d.save(`inadimplencia_pj_${stamp()}.pdf`);
}
